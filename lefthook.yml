# Git hooks (https://lefthook.dev). Installed by `npm install` via the
# "prepare" script. Never bypass with --no-verify.
pre-commit:
  parallel: true
  commands:
    test:
      # The sync-host watcher test races temp-vault teardown at the default
      # one-worker-per-file setting. Keep commits parallel, but bound Vitest
      # workers so the full suite is deterministic on developer machines.
      run: npm run check:unit
    typecheck:
      run: npm run check:type
    lint:
      # Staged files only: a whole-repo lint alongside the test run starves
      # the timing-sensitive sync tests of CPU. CI lints everything.
      glob: "*.{ts,tsx,js,mjs}"
      run: npx eslint --max-warnings=0 --no-warn-ignored {staged_files}

# Full CI checks and the release image build run before pushes, not every
# commit. This keeps pre-commit fast while making pushes CI-complete.
pre-push:
  parallel: false
  commands:
    ci:
      # Run every automated CI check before allowing a push.
      run: npm run check:ci
    docker:
      # Match CI's linux/amd64 Dockerfile build. The registry push remains CI-only.
      run: npm run check:docker
