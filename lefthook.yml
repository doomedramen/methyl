# Git hooks (https://lefthook.dev). Installed by `npm install` via the
# "prepare" script. Never bypass with --no-verify.
pre-commit:
  parallel: true
  commands:
    test:
      # The sync-host watcher test races temp-vault teardown at the default
      # one-worker-per-file setting. Keep commits parallel, but bound Vitest
      # workers so the full suite is deterministic on developer machines.
      run: npm test -- --maxWorkers=4
    typecheck:
      run: npx tsc --noEmit

# E2E needs a full production build (~minutes), so it gates pushes, not
# every commit.
pre-push:
  commands:
    e2e:
      # Same parallelism as CI (playwright.config.ts): the suite flakes under
      # the default half-the-cores workers on a busy machine.
      run: npm run test:e2e -- --workers=2
